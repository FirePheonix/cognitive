name: Deploy Media to Phone

# Runs only when files inside media/ are pushed to main.
# Uploads ONLY the changed media files to the phone via the Cloudflare Tunnel
# HTTP API at https://uploads.getcognitive.in (server.py / s3lite).
# Files are then publicly readable at https://uploads.getcognitive.in/files/...

on:
  push:
    branches: [main, master]
    paths:
      - 'media/**'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Upload ALL files in media/ instead of just changed ones'
        required: false
        default: 'false'
        type: boolean
      paths:
        description: >-
          Newline-separated media/ paths to upload (overrides diff when set).
          Example: media/appendix-g-modern-llm-systems/chapter-29-interpretability/chapter-29.wav
        required: false
        type: string

jobs:
  deploy-media:
    name: Upload media to phone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── Validate required secrets ──────────────────────────────────────────
      - name: Validate secrets
        env:
          MEDIA_API_KEY: ${{ secrets.MEDIA_API_KEY }}
        run: |
          if [ -z "$MEDIA_API_KEY" ]; then
            echo "::error::MEDIA_API_KEY secret is not set. Aborting."
            exit 1
          fi

      # ── Determine which files changed ─────────────────────────────────────
      - name: Find changed media files
        id: changed
        env:
          FULL_SYNC: ${{ github.event.inputs.full_sync }}
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then
            echo "Explicit path list requested"
            FILES=$(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d' | sort -u)
          elif [ "$FULL_SYNC" = "true" ]; then
            echo "Full sync requested — gathering all files in media/"
            FILES=$(find media -type f | sort)
          else
            echo "Diffing against previous commit"
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD -- 'media/**' | sort)
          fi

          if [ -z "$FILES" ]; then
            echo "No media files changed. Skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Files to upload:"
            echo "$FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$FILES" > /tmp/media-files.txt
          fi

      # ── Upload each file via HTTP PUT to the s3lite API ───────────────────
      - name: Upload changed files to phone
        if: steps.changed.outputs.skip != 'true'
        env:
          UPLOAD_BASE_URL: ${{ secrets.MEDIA_UPLOAD_URL || 'https://uploads.getcognitive.in' }}
          API_KEY: ${{ secrets.MEDIA_API_KEY }}
        run: |
          FAILED=0
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "   ✗ MISSING $file"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Strip the leading "media/" prefix so the remote key mirrors the
            # folder structure under the server's STORAGE_DIR.
            # local:  media/part-i-foundations/chapter-1/1-1.wav
            # remote key: part-i-foundations/chapter-1/1-1.wav
            remote_key="${file#media/}"
            url="$UPLOAD_BASE_URL/files/$remote_key"

            echo "→ uploading: $file  →  $url"

            # Retry transient tunnel/origin failures (common 502s on large WAVs).
            attempt=1
            max_attempts=4
            http_code="000"
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "" > /tmp/curl_response.txt
              http_code=$(curl -s -o /tmp/curl_response.txt -w "%{http_code}" \
                --connect-timeout 30 \
                --max-time 600 \
                -X PUT \
                -H "X-API-Key: $API_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "$url" || true)

              if [ "$http_code" = "201" ] || [ "$http_code" = "200" ]; then
                break
              fi

              if [ "$attempt" -lt "$max_attempts" ] && { [ "$http_code" = "502" ] || [ "$http_code" = "503" ] || [ "$http_code" = "504" ] || [ "$http_code" = "000" ]; }; then
                sleep_for=$((attempt * 15))
                echo "   ↻ attempt $attempt/$max_attempts got HTTP $http_code — retrying in ${sleep_for}s"
                sleep "$sleep_for"
                attempt=$((attempt + 1))
                continue
              fi
              break
            done

            if [ "$http_code" = "201" ] || [ "$http_code" = "200" ]; then
              echo "   ✓ $file ($http_code)"
            else
              echo "   ✗ FAILED $file — HTTP $http_code"
              # Sanitize response before logging (avoid leaking sensitive data)
              head -c 500 /tmp/curl_response.txt
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/media-files.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED file(s) failed to upload."
            exit 1
          fi

      - name: Done
        if: steps.changed.outputs.skip != 'true'
        run: echo "Media upload complete."
